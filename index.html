<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stratis Bakas — Lead Product Designer</title>
  <meta name="description" content="Stratis Bakas — Lead Product Designer, Lyon." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #F5F2ED;
      --ink: #1A1714;
      --muted: #8C8479;
      --accent: #C8572A;
    }
    html, body { height: 100%; background: var(--bg); color: var(--ink); font-family: 'DM Sans', sans-serif; font-weight: 300; }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      opacity: .03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-size: 200px;
    }
    .page {
      min-height: 100dvh;
      display: grid;
      grid-template-columns: 1fr 1fr;
    }
    .left {
      display: grid;
      grid-template-rows: 1fr auto;
      padding: clamp(2rem, 6vw, 5rem);
    }
    .content { display: flex; flex-direction: column; justify-content: center; }
    .eyebrow {
      font-size: clamp(.7rem, 1.1vw, .82rem);
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.6rem;
      opacity: 0;
      animation: fadeUp .6s ease forwards .1s;
    }
    h1 {
      font-family: 'DM Serif Display', serif;
      font-style: italic;
      font-size: clamp(3rem, 7vw, 7.5rem);
      line-height: .93;
      letter-spacing: -.02em;
      opacity: 0;
      animation: fadeUp .7s ease forwards .25s;
    }
    h1 em { font-style: normal; color: var(--accent); }
    .role {
      margin-top: 2rem;
      display: flex;
      flex-direction: column;
      gap: .5rem;
      opacity: 0;
      animation: fadeUp .7s ease forwards .4s;
    }
    .role-title { font-size: clamp(.95rem, 1.8vw, 1.2rem); font-weight: 400; }
    .role-years {
      font-size: clamp(.78rem, 1.2vw, .9rem);
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: .7rem;
    }
    .role-years::before {
      content: '';
      display: inline-block;
      width: 1.8rem;
      height: 1px;
      background: var(--muted);
    }
    footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 1rem;
      opacity: 0;
      animation: fadeUp .7s ease forwards .55s;
    }
    .location { font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    nav { display: flex; gap: 1.6rem; }
    nav a {
      font-size: .82rem;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      position: relative;
      transition: color .2s;
    }
    nav a::after {
      content: '';
      position: absolute;
      bottom: -2px; left: 0;
      width: 0; height: 1px;
      background: var(--accent);
      transition: width .25s ease;
    }
    nav a:hover { color: var(--ink); }
    nav a:hover::after { width: 100%; }
    .right {
      position: relative;
      overflow: hidden;
      opacity: 0;
      animation: fadeIn .9s ease forwards .2s;
    }
    .right img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

    @media (max-width: 700px) {
      .page { display: block; width: 100%; min-height: 100dvh; }
      .right { display: none; }
      .left { width: 100%; min-height: 100dvh; padding: clamp(2rem, 8vw, 3rem); }
      h1 { font-size: clamp(4rem, 18vw, 6rem); }
      footer { flex-direction: column; align-items: flex-start; }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
  </style>
</head>
